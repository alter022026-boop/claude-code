<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI Assistant - Casos de Uso</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Menu View */
    .menu-view {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .menu-header {
      text-align: center;
      color: white;
      padding: 40px 20px;
    }

    .menu-header h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .menu-header p {
      font-size: 18px;
      opacity: 0.9;
    }

    .category {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .category-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      font-size: 24px;
      font-weight: 600;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
      border-color: #667eea;
    }

    .card-emoji {
      font-size: 32px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .card-description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    /* Chat View */
    .chat-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .chat-view.active {
      display: flex;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 20px;
      font-weight: 600;
    }

    .chat-header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-header-controls select {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .chat-header-controls select option {
      background: #667eea;
      color: white;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-avatar {
      font-size: 24px;
      flex-shrink: 0;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: white;
      color: #333;
      border: 1px solid #e9ecef;
      border-bottom-left-radius: 4px;
    }

    .loading {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      width: fit-content;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      animation: bounce 1.4s infinite;
    }

    .loading-dot:nth-child(1) { animation-delay: 0s; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-8px);
      }
    }

    .welcome {
      text-align: center;
      color: #999;
      padding: 60px 20px;
    }

    .welcome h2 {
      margin-bottom: 10px;
      color: #667eea;
      font-size: 24px;
    }

    .input-area {
      padding: 20px;
      border-top: 1px solid #e9ecef;
      display: flex;
      gap: 10px;
      background: white;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-area button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }

    .input-area button:hover {
      transform: translateY(-2px);
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 8px 12px;
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.error {
      background: rgba(255, 0, 0, 0.1);
      color: #c00;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Menu View -->
    <div class="menu-view" id="menuView">
      <div class="menu-header">
        <h1>🤖 AI Assistant</h1>
        <p>Escolha um caso de uso especializado para começar</p>
      </div>

      <!-- Desenvolvimento -->
      <div class="category">
        <div class="category-header">👨‍💻 Desenvolvimento</div>
        <div class="cards-grid" id="devCards"></div>
      </div>

      <!-- Produtividade -->
      <div class="category">
        <div class="category-header">⚡ Produtividade</div>
        <div class="cards-grid" id="prodCards"></div>
      </div>

      <!-- Dados & Análise -->
      <div class="category">
        <div class="category-header">📊 Dados & Análise</div>
        <div class="cards-grid" id="dataCards"></div>
      </div>
    </div>

    <!-- Chat View -->
    <div class="chat-view" id="chatView">
      <div class="chat-header">
        <div class="chat-header-title">
          <span id="modeEmoji">🔍</span>
          <span id="modeTitle">Análise de Código</span>
        </div>
        <div class="chat-header-controls">
          <select id="modelSelect" onchange="changeModel(this.value)">
            <option value="">Carregando modelos...</option>
          </select>
          <button class="back-btn" onclick="backToMenu()">← Voltar</button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="welcome">
          <h2>👋 Bem-vindo!</h2>
          <p>Comece digitando sua pergunta abaixo</p>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Digite sua pergunta..."
          onkeypress="handleKeyPress(event)"
        />
        <button onclick="sendMessage()" id="sendBtn">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    let currentMode = '';
    let currentModel = '';
    let isLoading = false;

    const useCaseMappings = {
      'analyze-code': { emoji: '🔍', title: 'Análise de Código' },
      'debug-error': { emoji: '🐛', title: 'Debug Assistido' },
      'suggest-refactor': { emoji: '✨', title: 'Sugestões de Melhoria' },
      'write-doc': { emoji: '📚', title: 'Gerar Documentação' },
      'summarize': { emoji: '📝', title: 'Resumir Textos' },
      'brainstorm': { emoji: '💡', title: 'Brainstorm Criativo' },
      'process-data': { emoji: '📊', title: 'Processar Dados' },
      'generate-report': { emoji: '📈', title: 'Gerar Relatórios' },
      'insights': { emoji: '🎯', title: 'Análise de Insights' },
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadUseCases();
      loadModels();
    });

    async function loadUseCases() {
      try {
        const response = await fetch('/api/usecases');
        const data = await response.json();

        renderCards('devCards', data.development);
        renderCards('prodCards', data.productivity);
        renderCards('dataCards', data.data);
      } catch (error) {
        console.error('Error loading use cases:', error);
      }
    }

    function renderCards(containerId, cards) {
      const container = document.getElementById(containerId);
      container.innerHTML = cards.map(card => `
        <div class="card" onclick="selectUseCase('${card.id}')">
          <div class="card-emoji">${card.label.split(' ')[0]}</div>
          <div class="card-title">${card.label}</div>
          <div class="card-description">${card.description}</div>
        </div>
      `).join('');
    }

    async function loadModels() {
      try {
        const response = await fetch('/api/models');
        const models = await response.json();

        if (!models || models.length === 0) {
          document.getElementById('modelSelect').innerHTML =
            '<option>Nenhum modelo disponível</option>';
          return;
        }

        const select = document.getElementById('modelSelect');
        select.innerHTML = models
          .map(m => `<option value="${m.name}">${m.name}</option>`)
          .join('');

        currentModel = models[0].name;
      } catch (error) {
        console.error('Error loading models:', error);
      }
    }

    function selectUseCase(mode) {
      currentMode = mode;
      const mapping = useCaseMappings[mode];
      
      document.getElementById('modeEmoji').textContent = mapping.emoji;
      document.getElementById('modeTitle').textContent = mapping.title;
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('chatView').classList.add('active');
      document.getElementById('messageInput').focus();
      document.getElementById('chatMessages').innerHTML = `
        <div class="welcome">
          <h2>${mapping.emoji} ${mapping.title}</h2>
          <p>Comece digitando sua pergunta abaixo</p>
        </div>
      `;
    }

    function backToMenu() {
      document.getElementById('chatView').classList.remove('active');
      document.getElementById('menuView').style.display = 'flex';
      currentMode = '';
      document.getElementById('messageInput').value = '';
    }

    function changeModel(model) {
      currentModel = model;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();

      if (!message || isLoading || !currentModel) return;

      addMessage(message, 'user');
      input.value = '';
      isLoading = true;
      document.getElementById('sendBtn').disabled = true;

      const messagesDiv = document.getElementById('chatMessages');
      const welcome = messagesDiv.querySelector('.welcome');
      if (welcome) welcome.remove();

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = '<div class="message-avatar">🤖</div><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
      messagesDiv.appendChild(loadingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, model: currentModel, mode: currentMode }),
        });

        const data = await response.json();
        loadingDiv.remove();

        if (response.ok) {
          addMessage(data.response, 'assistant');
        } else {
          addMessage(`❌ Erro: ${data.error}`, 'assistant');
        }
      } catch (error) {
        loadingDiv.remove();
        addMessage(`❌ Erro: ${error.message}`, 'assistant');
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function addMessage(content, role) {
      const messagesDiv = document.getElementById('chatMessages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      if (role === 'user') {
        messageDiv.appendChild(contentDiv);
        messageDiv.appendChild(avatar);
      } else {
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(contentDiv);
      }

      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
