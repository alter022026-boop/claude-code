<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI Assistant - Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1600px;
      height: 90vh;
      display: flex;
      gap: 20px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    /* Main Chat Section */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 20px;
      font-weight: 600;
    }

    .chat-header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-header-controls select {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .chat-header-controls select:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-header-controls select option {
      background: #667eea;
      color: white;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-avatar {
      font-size: 24px;
      flex-shrink: 0;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: white;
      color: #333;
      border: 1px solid #e9ecef;
      border-bottom-left-radius: 4px;
    }

    .loading {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      width: fit-content;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      animation: bounce 1.4s infinite;
    }

    .loading-dot:nth-child(1) { animation-delay: 0s; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-8px);
      }
    }

    .welcome {
      text-align: center;
      color: #999;
      padding: 60px 20px;
    }

    .welcome h2 {
      margin-bottom: 10px;
      color: #667eea;
      font-size: 24px;
    }

    .input-area {
      padding: 20px;
      border-top: 1px solid #e9ecef;
      display: flex;
      gap: 10px;
      background: white;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-area button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }

    .input-area button:hover {
      transform: translateY(-2px);
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Sidebar com Cases */
    .sidebar {
      width: 320px;
      border-left: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      background: #fafbfc;
      overflow-y: auto;
    }

    .sidebar-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 15px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #e9ecef;
    }

    .sidebar-content {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mini-card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      border-left: 4px solid #667eea;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mini-card:hover {
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
      background: #f0f4ff;
    }

    .mini-card-emoji {
      font-size: 20px;
    }

    .mini-card-title {
      font-size: 12px;
      font-weight: 600;
      color: #333;
    }

    .sidebar-category {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e9ecef;
    }

    .sidebar-category:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .category-label {
      font-size: 11px;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      padding: 6px 12px;
      margin-bottom: 6px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }

    @media (max-width: 1200px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 120px;
        border-left: none;
        border-top: 1px solid #e9ecef;
      }

      .sidebar-content {
        flex-direction: row;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Chat Section -->
    <div class="chat-section">
      <div class="chat-header">
        <div class="chat-header-title">
          <span id="modeEmoji">🤖</span>
          <span id="modeTitle">AI Assistant</span>
        </div>
        <div class="chat-header-controls">
          <select id="modelSelect" onchange="changeModel(this.value)">
            <option value="">Carregando modelos...</option>
          </select>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="welcome">
          <h2>👋 Bem-vindo ao AI Assistant</h2>
          <p>Selecione um caso de uso à direita ou comece a conversar</p>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Digite sua pergunta..."
          onkeypress="handleKeyPress(event)"
        />
        <button onclick="sendMessage()" id="sendBtn">Enviar</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">📋 Casos de Uso</div>
      <div class="sidebar-content">
        <!-- Dev Cards -->
        <div class="sidebar-category">
          <div class="category-label">Desenvolvimento</div>
          <div id="devCards"></div>
        </div>

        <!-- Prod Cards -->
        <div class="sidebar-category">
          <div class="category-label">Produtividade</div>
          <div id="prodCards"></div>
        </div>

        <!-- Data Cards -->
        <div class="sidebar-category">
          <div class="category-label">Dados & Análise</div>
          <div id="dataCards"></div>
        </div>

        <!-- Agent Card -->
        <div class="sidebar-category">
          <div class="category-label">Agente</div>
          <div id="agentCards"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'general';
    let currentModel = '';
    let isLoading = false;

    const useCaseMappings = {
      'analyze-code': { emoji: '🔍', title: 'Análise de Código' },
      'debug-error': { emoji: '🐛', title: 'Debug Assistido' },
      'suggest-refactor': { emoji: '✨', title: 'Sugestões de Melhoria' },
      'write-doc': { emoji: '📚', title: 'Gerar Documentação' },
      'summarize': { emoji: '📝', title: 'Resumir Textos' },
      'brainstorm': { emoji: '💡', title: 'Brainstorm Criativo' },
      'process-data': { emoji: '📊', title: 'Processar Dados' },
      'generate-report': { emoji: '📈', title: 'Gerar Relatórios' },
      'insights': { emoji: '🎯', title: 'Análise de Insights' },
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadUseCases();
      loadModels();
    });

    async function loadUseCases() {
      try {
        const response = await fetch('/api/usecases');
        const data = await response.json();

        renderMiniCards('devCards', data.development);
        renderMiniCards('prodCards', data.productivity);
        renderMiniCards('dataCards', data.data);
        renderMiniCards('agentCards', data.agent);
      } catch (error) {
        console.error('Error loading use cases:', error);
      }
    }

    function renderMiniCards(containerId, cards) {
      const container = document.getElementById(containerId);
      container.innerHTML = cards.map(card => `
        <div class="mini-card" onclick="selectUseCase('${card.id}')">
          <div class="mini-card-emoji">${card.label.split(' ')[0]}</div>
          <div class="mini-card-title">${card.label}</div>
        </div>
      `).join('');
    }

    async function loadModels() {
      try {
        const response = await fetch('/api/models');
        const models = await response.json();

        if (!models || models.length === 0) {
          document.getElementById('modelSelect').innerHTML =
            '<option>Nenhum modelo disponível</option>';
          return;
        }

        const select = document.getElementById('modelSelect');
        select.innerHTML = models
          .map(m => `<option value="${m.name}">${m.name}</option>`)
          .join('');

        currentModel = models[0].name;
      } catch (error) {
        console.error('Error loading models:', error);
      }
    }

    function selectUseCase(mode) {
      currentMode = mode;
      const mapping = useCaseMappings[mode];
      
      document.getElementById('modeEmoji').textContent = mapping.emoji;
      document.getElementById('modeTitle').textContent = mapping.title;
      document.getElementById('messageInput').focus();
    }

    function changeModel(model) {
      currentModel = model;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();

      if (!message || isLoading || !currentModel) return;

      addMessage(message, 'user');
      input.value = '';
      isLoading = true;
      document.getElementById('sendBtn').disabled = true;

      const messagesDiv = document.getElementById('chatMessages');
      const welcome = messagesDiv.querySelector('.welcome');
      if (welcome) welcome.remove();

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = '<div class="message-avatar">🤖</div><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
      messagesDiv.appendChild(loadingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, model: currentModel, mode: currentMode }),
        });

        const data = await response.json();
        loadingDiv.remove();

        if (response.ok) {
          addMessage(data.response, 'assistant');
        } else {
          addMessage(`❌ Erro: ${data.error}`, 'assistant');
        }
      } catch (error) {
        loadingDiv.remove();
        addMessage(`❌ Erro: ${error.message}`, 'assistant');
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function addMessage(content, role) {
      const messagesDiv = document.getElementById('chatMessages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      if (role === 'user') {
        messageDiv.appendChild(contentDiv);
        messageDiv.appendChild(avatar);
      } else {
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(contentDiv);
      }

      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
